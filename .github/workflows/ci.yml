name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: gradle
        uses: gradle/actions/setup-gradle@v3

      - name: test
        run: ./gradlew --no-daemon test

      - name: bundle
        run: ./gradlew --no-daemon bundle

  android:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradle
        uses: gradle/actions/setup-gradle@v3

      - name: android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0'

      - name: test
        run: ./gradlew --no-daemon -Paduki.android=true :android:testDebugUnitTest :sample:assembleDebug
